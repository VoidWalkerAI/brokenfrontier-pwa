name: Auto Build Bump

on:
  push:
    branches:
      - main

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Increment build
        run: |
          CURRENT=$(grep -oP 'window.BF_BUILD\s*=\s*"\K[0-9]+' index.html)
          NEXT=$((CURRENT + 1))
          sed -i "s/window.BF_BUILD = \"$CURRENT\"/window.BF_BUILD = \"$NEXT\"/" index.html
          sed -i "s/const BUILD = \"$CURRENT\"/const BUILD = \"$NEXT\"/" service-worker.js
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto bump build to $NEXT"
          git push
